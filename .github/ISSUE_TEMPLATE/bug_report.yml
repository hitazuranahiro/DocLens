name: Bug report
description: Something is broken or behaving unexpectedly.
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more concrete the repro, the faster it gets fixed.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What did you try, what happened, what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps a stranger could follow.
      placeholder: |
        1. Run `make up`
        2. Hit `POST /v1/documents` with a 30 MB PDF
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or screenshots.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DocLens version / commit SHA
      placeholder: e.g. v0.1.0 or 07c2608
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apps/api
        - apps/web
        - apps/extraction-worker
        - infra/docker
        - docs/ADRs
        - other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS: macOS 14.5
        Go: 1.22
        Node: 20.11
        Docker: 26.1
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
