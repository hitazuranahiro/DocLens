name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go work sync
        run: go work sync

      - name: Generate API server stubs
        run: |
          (cd apps/api && go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen \
            --config oapi-codegen.yaml openapi.yaml)

      - name: Build
        run: |
          set -e
          for mod in $(find services apps -name go.mod 2>/dev/null); do
            dir=$(dirname "$mod")
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done

      - name: Test
        run: |
          set -e
          for mod in $(find services apps -name go.mod 2>/dev/null); do
            dir=$(dirname "$mod")
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate API client types
        run: pnpm --filter @doclens/api-client gen

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADR index references existing files
        run: |
          set -e
          missing=0
          for f in $(grep -oE '[0-9]{4}-[a-z0-9-]+\.md' docs/adr/README.md | sort -u); do
            if [ ! -f "docs/adr/$f" ]; then
              echo "Missing ADR file referenced in index: $f"
              missing=1
            fi
          done
          exit $missing
