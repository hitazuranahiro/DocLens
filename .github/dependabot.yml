# Dependabot configuration for DocLens
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Root npm/pnpm workspace (Turborepo, ESLint, Prettier, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      dev-deps:
        dependency-type: development
        patterns:
          - "*"
      types:
        patterns:
          - "@types/*"

  # API client package
  - package-ecosystem: npm
    directory: /packages/api-client
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - javascript

  # Go API service
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - go

  # Shared Go module
  - package-ecosystem: gomod
    directory: /services/shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - go

  # Local dev compose stack base images
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - docker
