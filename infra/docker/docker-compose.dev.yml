# DocLens dev stack.
#
# Brings up the data layer (Postgres, Redis, MinIO) plus a stub for the API
# so contributors can verify networking before later milestones add the real
# api/worker/web services.
#
# Persistent volumes live under infra/docker/data/ (gitignored).

services:
  postgres:
    image: postgres:16-alpine
    container_name: doclens-postgres
    environment:
      POSTGRES_USER: doclens
      POSTGRES_PASSWORD: doclens
      POSTGRES_DB: doclens
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doclens-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: doclens-minio
    environment:
      MINIO_ROOT_USER: doclens
      MINIO_ROOT_PASSWORD: doclens-dev-secret
      # Dev-only: allow browser PUTs from any origin so the web app's
      # presigned uploads work without per-bucket CORS. NEVER use this
      # value in production — set the production web origin only.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot helper that creates the buckets DocLens expects.
  # Re-running is safe; mc returns success on already-existing buckets.
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: doclens-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 doclens doclens-dev-secret &&
      mc mb --ignore-existing local/doclens-raw &&
      mc mb --ignore-existing local/doclens-artifacts &&
      mc mb --ignore-existing local/doclens-public &&
      echo 'buckets ready';
      "
    restart: "no"
